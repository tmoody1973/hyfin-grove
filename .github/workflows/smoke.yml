name: Smoke test deployments

# CI only builds; it never runs a page. On 2026-11-18 a green build still 500'd every Payload page in
# production (jsdom in the server bundle). This runs real requests against each Vercel deployment.
on: deployment_status

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Request key pages
        env:
          BASE: ${{ github.event.deployment_status.environment_url }}
          # Vercel > Settings > Deployment Protection > Protection Bypass for Automation; stored as a repo secret.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set; preview pages are behind Vercel login, skipping smoke test."
            exit 0
          fi
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -H "x-vercel-protection-bypass: $BYPASS" "$BASE$1")
            if [ "$code" = "$2" ]; then echo "ok   $code $1"; else echo "::error::$1 answered $code, expected $2"; fail=1; fi
          }
          check / 200
          check /admin/login 200
          check /music/szas-lyrics-validate-my-experience-as-a-black-woman 200
          check /2024/04/07/szas-lyrics-validate-my-experience-as-a-black-woman 308
          check /listen/playlist 200
          check /listen/schedule 200
          check /listen 307
          check /shows/ladies-first 200
          check /events 200
          check /music 200
          check /culture 200
          check /milwaukee 200
          check /tag/new-releases 200
          check /shows/new-music-mondays 200
          check /feed.xml 200
          check /tag/nope 308
          check /no-such-page-hyfin-check 404
          check /milwaukee/kasi-lemmons-movies-eves-bayou 200
          check /thewiz 200
          check /events/past 200
          check /support 200
          check /donate 308
          check /sitemap.xml 200
          check /playlist-2 308
          check /category/interviews 308
          check /2024/04/07 308
          # Google sign-in has keys only in Production (previews can't be registered with Google).
          if [ "$ENVIRONMENT" = "Production" ]; then
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 60 -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/users/oauth/google")
            case "$loc" in https://accounts.google.com/*hd=radiomilwaukee.org*) echo "ok   Google sign-in redirects to Google";; *) echo "::error::/api/users/oauth/google did not redirect to Google (got: ${loc%%\?*})"; fail=1;; esac
          fi
          exit $fail

  # The phone app on a real deployment (plan 15, task 9): iPhone 13 and Pixel 7 profiles, plus desktop at 1440 px.
  # Here, not in CI: these pages read the database, which only deployments have.
  phone-app:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
